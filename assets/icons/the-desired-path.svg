<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='8 10 100 100' role='img' aria-label='The Desired Path'>
<title>The Desired Path</title>
<defs>
<linearGradient id='word' gradientUnits='userSpaceOnUse' x1='124.0' y1='0' x2='486.5447692871094' y2='0'><stop offset='0' stop-color='#B8862F'/><stop offset='0.45' stop-color='#F5DFA6'/><stop offset='0.6' stop-color='#E2B65C'/><stop offset='1' stop-color='#C9973F'/><animateTransform attributeName='gradientTransform' type='translate' values='-120 0;120 0;-120 0' dur='7s' repeatCount='indefinite'/></linearGradient>
<linearGradient id='ring' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#F5DFA6'/><stop offset='0.5' stop-color='#E2B65C'/><stop offset='1' stop-color='#8E6B33'/></linearGradient>
<radialGradient id='halo'><stop offset='0' stop-color='#FFE9A8' stop-opacity='0.85'/><stop offset='0.35' stop-color='#FF8A3D' stop-opacity='0.35'/><stop offset='1' stop-color='#FF8A3D' stop-opacity='0'/></radialGradient>
</defs>
<style>
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.7s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(0)}25%{transform:scale(.92,1.08) rotate(-3deg)}50%{transform:scale(1.04,.95) rotate(2deg)}75%{transform:scale(.96,1.05) rotate(-1deg)}}
.halo{transform-box:fill-box;transform-origin:center;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.flame,.halo{animation:none}}
</style>
<g transform='translate(10 12)'>
<circle class='halo' cx='48' cy='30' r='34' fill='url(#halo)'/>
<circle cx='48' cy='52' r='42' fill='#1B1320' stroke='url(#ring)' stroke-width='3'/>
<circle cx='48' cy='52' r='35' fill='none' stroke='#8E6B33' stroke-width='1' opacity='.7'/>
<path d='M26 72 L26 50 L37 60 L48 42 L59 60 L70 50 L70 72 Z' fill='url(#ring)' stroke='#9C7334' stroke-width='1.6' stroke-linejoin='round'/>
<rect x='26' y='72' width='44' height='6' rx='2' fill='url(#ring)'/>
<circle cx='48' cy='65' r='3.6' fill='#7A1F2B'/>
<g class='flame'><path d='M48 14 C55 22 54 30 48 32 C42 30 41 22 48 14 Z' fill='#FFB347'/><path d='M48 22 C51 26 50 30 48 31 C46 30 45 26 48 22 Z' fill='#FFF1B8'/></g>
